[workspace]
members = ["app", "core", "tui"]
resolver = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_clone = "warn"
perf = "warn"

[workspace.lints.rust]
missing_docs = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
