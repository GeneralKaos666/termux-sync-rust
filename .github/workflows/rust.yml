name: Rust

on:
  push:
    paths:
      - "rust/**"
      - "tui/**"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "tui/**"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

jobs:
  app:
    name: CLI and core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format core
        run: cargo fmt --manifest-path rust/termux-sync-core/Cargo.toml --check
      - name: Test core
        run: cargo test --locked --manifest-path rust/termux-sync-core/Cargo.toml
      - name: Clippy core
        run: cargo clippy --locked --manifest-path rust/termux-sync-core/Cargo.toml --all-targets -- -D warnings
      - name: Format app
        run: cargo fmt --manifest-path rust/app/Cargo.toml --check
      - name: Test app
        run: cargo test --locked --manifest-path rust/app/Cargo.toml
      - name: Clippy app
        run: cargo clippy --locked --manifest-path rust/app/Cargo.toml --all-targets -- -D warnings
