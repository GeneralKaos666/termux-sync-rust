[package]
name = "termux-sync-rs"
version = "2.0.0"
edition = "2024"
publish = false
description = "Pure Rust termux-sync CLI"
rust-version = "1.100"

[[bin]]
name = "termux-sync-rs"
path = "src/main.rs"

[dependencies]
serde_json = "1"
termux-sync-core = { path = "../core" }
termux-sync-tui = { path = "../tui" }

[dev-dependencies]
trycmd = "1"
tempfile = "3"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }

[lints]
workspace = true
