[package]
name = "termux-sync-tui"
version = "2.0.0"
edition = "2024"
publish = false
description = "Spike: Ratatui dashboard wrapper for the termux-sync CLI"
license = "MIT"

[dependencies]
termux-sync-core = { path = "../core" }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
