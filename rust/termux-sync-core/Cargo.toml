[package]
name = "termux-sync-core"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
publish = false
description = "Rust port of `src/termux_sync/`, generated by rust-anything"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
terminal_size = "0.4"
regex = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
fs4 = "0.13"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
bzip2 = "0.6"
xz2 = "0.1"
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
